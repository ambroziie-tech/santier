<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Șantier Manager</title>

  <!-- ca să arate a aplicație când e pusă pe ecranul principal -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#17191D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Șantier" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <style>
    html, body { margin: 0; padding: 0; background: #17191D; }
    #pornire {
      color: #8B919C; font-family: system-ui, sans-serif; text-align: center;
      padding: 80px 20px; font-size: 14px;
    }
    #pornire b { color: #F5B301; display: block; font-size: 18px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="root"><div id="pornire"><b>Șantier Manager</b>Se încarcă…</div></div>

  <!-- datele tale de conectare la Supabase -->
  <script src="./config.js"></script>

  <!-- biblioteci -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- aplicația -->
  <script type="text/babel" data-presets="react" src="./app.jsx"></script>

  <script>
    // service worker: doar ca să se poată instala pe ecranul principal
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>

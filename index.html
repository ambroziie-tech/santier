<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Șantier Manager</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#17191D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Șantier" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <style>
    html, body { margin: 0; padding: 0; background: #17191D; }
    #pornire { color:#8B919C; font-family:system-ui,sans-serif; font-size:14px;
      max-width:560px; margin:0 auto;
      padding:calc(env(safe-area-inset-top, 0px) + 40px) 20px
              calc(env(safe-area-inset-bottom, 0px) + 40px); }
    #pornire b { color:#F5B301; display:block; font-size:18px; margin-bottom:14px; }
    #stare div { padding:3px 0; font-family:ui-monospace,monospace; font-size:12px; }
    #stare .ok { color:#4CAF7D; } #stare .rau { color:#E5564D; }
    #eroare { margin:0 auto; max-width:520px; padding:12px; border:1px solid #E5564D; border-radius:9px;
      color:#E5564D; font-family:ui-monospace,monospace; font-size:12px;
      white-space:pre-wrap; word-break:break-word; display:none;
      background:#17191D; position:fixed; top:12px; left:12px; right:12px; z-index:99999;
      max-height:70vh; overflow:auto; box-shadow:0 4px 24px rgba(0,0,0,.6); }
  </style>
</head>
<body>
  <div id="root">
    <div id="pornire">
      <b>Șantier Manager</b>
      <div id="stare"></div>
    </div>
  </div>
  <div id="eroare">
    <div id="eroare-text"></div>
    <div style="margin-top:10px; display:flex; gap:8px">
      <button onclick="location.reload()" style="background:#E5564D; color:#fff; border:none;
        padding:7px 12px; border-radius:6px; font-family:ui-monospace,monospace; font-size:12px;
        cursor:pointer">Reîncarcă</button>
      <button onclick="document.getElementById('eroare').style.display='none'" style="background:transparent;
        color:#E5564D; border:1px solid #E5564D; padding:7px 12px; border-radius:6px;
        font-family:ui-monospace,monospace; font-size:12px; cursor:pointer">Ascunde</button>
    </div>
  </div>

  <script>
    var stare = document.getElementById("stare");
    var cutieEroare = document.getElementById("eroare");
    var textEroare = document.getElementById("eroare-text");
    function pas(t, ok) {
      var d = document.createElement("div");
      d.className = ok === false ? "rau" : (ok ? "ok" : "");
      d.textContent = (ok === false ? "X " : ok ? "OK " : ". ") + t;
      stare.appendChild(d);
    }
    function aratEroare(t) {
      cutieEroare.style.display = "block";
      textEroare.textContent += t + "\n\n";
    }
    window.addEventListener("error", function (e) {
      aratEroare("EROARE: " + (e.message || e));
    });
    window.addEventListener("unhandledrejection", function (e) {
      aratEroare("EROARE async: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    pas("pagina incarcata", true);
  </script>

  <script src="./config.js"></script>
  <script>
    if (typeof CONFIG === "undefined") pas("config.js LIPSESTE", false);
    else if (!CONFIG.URL || CONFIG.URL.indexOf("XXXX") >= 0) pas("config.js necompletat", false);
    else pas("config.js OK", true);
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <script>
    pas("React " + (typeof React !== "undefined" ? "OK" : "LIPSESTE"), typeof React !== "undefined");
    pas("Supabase " + (typeof window.supabase !== "undefined" ? "OK" : "LIPSESTE"), typeof window.supabase !== "undefined");
    pas("Babel " + (typeof Babel !== "undefined" ? "OK" : "LIPSESTE"), typeof Babel !== "undefined");

    // aduc intai traducerile (fisier separat, plain JS, fara Babel) — trebuie sa
    // existe inaintea lui app.jsx, care le foloseste imediat cum porneste
    function aduTraduceri() {
      pas("aduc traduceri.js (fara memorie cache)...");
      return fetch("./traduceri.js?v=" + Date.now(), { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("traduceri.js nu s-a putut descarca (cod " + r.status + ")");
          return r.text();
        })
        .then(function (cod) {
          (0, eval)(cod);
          pas("traduceri.js adus: " + Math.round(cod.length / 1024) + " KB", true);
        })
        .catch(function (e) {
          // fara traduceri, aplicatia tot merge — ramane doar in romana
          pas("traduceri.js n-a mers (" + (e.message || e) + "), continui doar cu romana", false);
          window.TRAD = {};
        });
    }

    // aduc app.jsx eu, cu ocolirea memoriei browserului, si il curat de eventuale
    // linii "import"/"export" ramase din varianta pentru Claude
    aduTraduceri().then(function () {
      pas("aduc app.jsx (fara memorie cache)...");
      return fetch("./app.jsx?v=" + Date.now(), { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("app.jsx nu s-a putut descarca (cod " + r.status + ")");
          return r.text();
        })
        .then(function (cod) {
          pas("app.jsx adus: " + Math.round(cod.length / 1024) + " KB", true);

          var areImport = /^\s*import\s/m.test(cod);
          var areStocare = cod.indexOf("STRAT DE STOCARE") >= 0;
          if (!areStocare) {
            pas("FISIER GRESIT: e varianta pentru Claude, nu cea pentru web", false);
            aratEroare("app.jsx de pe GitHub nu contine stratul de stocare Supabase.\n" +
                       "Incarca fisierul app.jsx din folderul santier-web.");
            return;
          }
          if (areImport) {
            cod = cod.replace(/^\s*import[^\n]*\n/gm, "");
            pas("am scos liniile import ramase", true);
          }
          cod = cod.replace(/^\s*export\s+default\s+/gm, "");

          pas("se compileaza, 10-20 secunde...");
          // "classic" e obligatoriu: modul nou ("automatic") adauga singur
          // un "import { jsx } from react/jsx-runtime", care nu merge in browser
          var iesire = Babel.transform(cod, {
            presets: [["react", { runtime: "classic" }]],
            sourceType: "script",
          }).code;
          if (/^\s*import\s/m.test(iesire)) {
            iesire = iesire.replace(/^\s*import[^\n]*\n/gm, "");
            pas("am scos importurile adaugate de Babel", true);
          }
          pas("compilat", true);
          (0, eval)(iesire);
        })
        .catch(function (e) {
          pas("a esuat", false);
          aratEroare(e.message || String(e));
        });
    });

    setTimeout(function () {
      if (document.getElementById("pornire")) pas("aplicatia tot nu a pornit", false);
    }, 30000);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
